; =========================================================================
; BAZOWE USTAWIENIA DLA ESP8266 (SILNIK)
; =========================================================================
[esp82xx_common]
framework = arduino
platform = espressif8266@^4.2.1
upload_speed = 256000
monitor_speed = 115200
upload_resetmethod = nodemcu
board_build.flash_mode = dout
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
build_flags =   
    -DNDEBUG
    -DFP_IN_IROM
    -DBEARSSL_SSL_BASIC
    -DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK22x_190703
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH
    -DVTABLES_IN_FLASH
    -DPSTR_ALIGN=1
    -DMIMETYPE_MINIMAL
    -D ATOMIC_FS_UPDATE

[env:GUI_Generic_1MB]
extends = esp82xx_common
board = esp8285
board_build.ldscript = eagle.flash.1m64.ld
build_flags = ${common.build_flags}

[env:GUI_Generic_4MB_ESP8266]
extends = esp82xx_common
board = esp12e
board_build.ldscript = eagle.flash.4m1m.ld
build_flags = ${common.build_flags}

; =========================================================================
; BAZOWE USTAWIENIA DLA ESP32 (SILNIK)
; =========================================================================
[common_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
upload_speed = 921600
board_build.f_flash = 80000000
board_build.f_cpu = 240000000
build_flags = ${common.build_flags} -D HASHBUILDER_NO_REDEFINE

[env:GUI_Generic_ESP32]
extends = common_esp32
board = esp32dev

; =========================================================================
; SZCZEGÓŁOWE KONFIGURACJE SPRZĘTU (ROZSZERZENIA CUSTOMOWE)
; =========================================================================

[env:Wemos_D1_Mini]
extends = env:GUI_Generic_4MB_ESP8266

[env:NodeMCU_ESP8266]
extends = env:GUI_Generic_4MB_ESP8266
board = nodemcuv2

[env:Wemos_S2_Mini]
extends = common_esp32
board = lolin_s2_mini
build_flags = ${common_esp32.build_flags} -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:ESP32_S3_N16R8]
extends = common_esp32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
build_flags = ${common_esp32.build_flags} -D BOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue

[env:ESP32_C3_Mini]
extends = common_esp32
board = esp32-c3-devkitm-1
build_flags = ${common_esp32.build_flags} -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:WT32_ETH01]
extends = common_esp32
board = wt32-eth01
build_flags = ${common_esp32.build_flags} -D SUPLA_WT32_ETH01_LAN8720

[env:Zielona_Plytka_1_Relay]
extends = env:GUI_Generic_4MB_ESP8266

[env:Zielona_Plytka_2_Relay]
extends = env:GUI_Generic_4MB_ESP8266

[env:H801_RGB]
extends = env:GUI_Generic_1MB
board = esp8285

[env:Sonoff_Basic_R4]
extends = env:GUI_Generic_ESP32

[env:Shelly_25]
extends = env:GUI_Generic_1MB
board = esp8285

[env:Gosund_SP111]
extends = env:GUI_Generic_1MB
board = esp8285